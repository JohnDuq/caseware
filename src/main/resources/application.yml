spring:
  application:
    name: template-publish-worker
  datasource:
    url: jdbc:h2:file:./data/caseware;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

worker:
  scheduling-enabled: true
  fan-out-page-size: 500
  max-fan-out-pages-per-run: 100
  max-concurrency: 8
  poll-delay: 250ms
  lease-duration: 2m
  max-attempts: 5
  retry-initial-delay: 5s
